# ---------- Частые вопросы ----------
faq_title: "<b>❓ Частые вопросы</b>\n\nВыберите вопрос:"

# Чтобы добавить вопрос — скопируйте пару question / answer.
# Текст кнопки (question) лучше делать коротким — до ~40 символов.
faq:
  - question: "Нужно ли покупать моющие средства?"
    answer: |
      Нет. Мы привозим всё с собой: профессиональную химию,
      инвентарь и пылесос. Средства безопасны для детей и животных.
  - question: "Сколько длится уборка?"
    answer: |
      Поддерживающая уборка квартиры 50 м² — около 3 часов,
      генеральная — 5–7 часов. Точное время назовёт менеджер.
  - question: "Как можно оплатить?"
    answer: |
      Наличными или переводом после уборки, картой,
      а для юрлиц — по счёту с закрывающими документами.
  - question: "Что если результат не понравится?"
    answer: |
      Сообщите нам в течение 24 часов — бесплатно приедем
      и переделаем то, что вас не устроило.
  - question: "Нужно ли быть дома во время уборки?"
    answer: |
      Не обязательно. Можно оставить ключи — все клинеры
      проходят проверку, а работа застрахована.

