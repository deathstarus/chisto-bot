    Спасибо! ✨ Ваша заявка №{lead_id} принята.
    Менеджер свяжется с вами в ближайшее время.
  cancelled: "Заявка отменена. Вы можете оставить её в любой момент."
  use_buttons: "Пожалуйста, выберите вариант с помощью кнопок выше 👆"

