    Проверьте, пожалуйста, вашу заявку:

    👤 Имя: <b>{name}</b>
    📱 Телефон: <b>{phone}</b>
    🧽 Услуга: <b>{service}</b>
    💬 Комментарий: {comment}

    Всё верно?
