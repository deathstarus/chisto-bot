# =====================================================================
#  ТЕКСТЫ БОТА КЛИНИНГОВОЙ КОМПАНИИ «ЧИСТО»
# =====================================================================
#  Здесь можно менять любые тексты, услуги, цены, вопросы и контакты.
#  После правки отправьте боту команду /reload (от имени администратора) —
#  изменения применятся сразу, без перезапуска.
#
#  Правила, чтобы ничего не сломать:
#   • Отступы делайте ПРОБЕЛАМИ (не табуляцией). Вложенность важна.
#   • Если текст многострочный — используйте «|» после двоеточия
#     и пишите текст с отступом на следующих строках (как ниже).
#   • Слова в фигурных скобках, например {name}, — это подстановки.
#     Их нужно оставить как есть, бот заменит их сам.
#   • Можно использовать оформление: <b>жирный</b>, <i>курсив</i>,
#     <a href="https://example.com">ссылка</a>.
#   • Символы < и > в обычном тексте пишите как &lt; и &gt;.
# =====================================================================

