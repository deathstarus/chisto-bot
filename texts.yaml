    Как к вам обращаться? Напишите ваше имя.
  bad_name: "Пожалуйста, напишите имя текстом (от 2 до 50 символов)."
  ask_phone: |
    Приятно познакомиться, {name}!

    Напишите номер телефона для связи, например: <code>+7 900 123-45-67</code>
    Или нажмите кнопку «Отправить мой номер» внизу экрана.
  bad_phone: |
    Не получилось распознать номер 🙈
    Нужен российский номер, например: <code>+7 900 123-45-67</code> или <code>89001234567</code>.
  ask_service: "Какая услуга вас интересует?"
  ask_comment: |
    Добавьте комментарий: адрес, площадь, удобные дата и время.
    Если комментария нет — нажмите «Пропустить».
